name: Kivelle Database

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kivelle-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify context-pricing database contract
        run: pnpm context:test:db
      - name: Verify chat-speed database contract
        run: pnpm chat-speed:test:db

      - name: Verify Apple review recovery database contract
        run: node scripts/test-apple-review-db.mjs
