name: Kivelle Database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/tests/**
      - supabase/config.toml
  pull_request:
    paths:
      - supabase/migrations/**
      - supabase/tests/**
      - supabase/config.toml

concurrency:
  group: kivelle-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated Supabase stack
        run: pnpm exec supabase start
      - name: Run database tests
        shell: bash
        run: set -o pipefail; pnpm supabase:test 2>&1 | tee /tmp/kivelle-db-test.log
        env:
          SUPABASE_DB_PASSWORD: postgres
      - name: Upload database test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kivelle-db-test-log
          path: /tmp/kivelle-db-test.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop isolated Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup
