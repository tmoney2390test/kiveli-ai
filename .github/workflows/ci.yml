name: Kivelle CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm guard:starter-content
      - run: pnpm edge:typecheck
      - run: pnpm --filter @together/app web:build
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      - run: pnpm exec supabase start
      - name: Run database tests
        shell: bash
        run: set -o pipefail; pnpm supabase:test 2>&1 | tee /tmp/kivelle-db-test.log
        env:
          SUPABASE_DB_PASSWORD: postgres
      - name: Upload database test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kivelle-db-test-log
          path: /tmp/kivelle-db-test.log
          if-no-files-found: ignore
          retention-days: 3
      - if: always()
        run: pnpm exec supabase stop --no-backup
