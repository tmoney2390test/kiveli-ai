name: Kivelle CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: kivelle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm context:test:db
      - run: pnpm chat-speed:test:db
      - name: Chat speed regressions
        run: deno test --allow-env --no-lock --unstable-sloppy-imports --config supabase/functions/deno.json supabase/functions/_shared/kivelle-chat-speed_test.ts
      - name: Context price regressions
        run: deno test --allow-env --no-lock --unstable-sloppy-imports --config supabase/functions/deno.json supabase/functions/_shared/kivelle-context-price_test.ts
      - name: Apple review recovery regressions
        run: >-
          deno test --allow-env --no-lock --unstable-sloppy-imports --config supabase/functions/deno.json
          supabase/functions/_shared/kivelle-ai-consent.test.ts
          supabase/functions/_shared/kivelle-apple-auth.test.ts
          supabase/functions/_shared/revenuecat.test.ts
          supabase/functions/_shared/kivelle-account-lifecycle.test.ts
          supabase/functions/_shared/private-adult-text-policy.test.ts
          supabase/functions/_shared/web-adult-access.test.ts
      - run: node scripts/test-apple-review-db.mjs
      - run: node --test scripts/verify-native-release-config.test.mjs
      - name: Store-only billing policy regressions
        run: deno test --allow-env --no-lock --unstable-sloppy-imports --config supabase/functions/deno.json supabase/functions/_shared/web-billing-policy.test.ts
      - run: pnpm guard:starter-content
      - run: pnpm edge:typecheck
      - name: Scheduled message regressions
        run: >-
          deno test --allow-env --no-lock --unstable-sloppy-imports --config supabase/functions/deno.json
          supabase/functions/_shared/kivelle-proactive-voice.test.ts
          supabase/functions/_shared/kivelle-proactive-context.test.ts
          supabase/functions/_shared/kivelle-proactive-delivery.test.ts
          supabase/functions/_shared/kivelle-initiative.test.ts
      - name: Video quality and finalization regressions
        run: >-
          deno test --allow-env --no-lock --unstable-sloppy-imports --config supabase/functions/deno.json
          supabase/functions/_shared/together-video-quality.test.ts
          supabase/functions/_shared/together-media-finalization-retry.test.ts
          supabase/functions/_shared/together-video-inspection.test.ts
          supabase/functions/_shared/together-video-faststart.test.ts
      - run: pnpm --filter @together/app web:build
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
