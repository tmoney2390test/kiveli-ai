name: Kivelle CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm guard:starter-content
      - run: pnpm edge:typecheck
      - run: pnpm --filter @together/app web:build
      - run: pnpm exec supabase start
      - run: pnpm supabase:test
        env:
          SUPABASE_DB_PASSWORD: postgres
      - if: always()
        run: pnpm exec supabase stop --no-backup
