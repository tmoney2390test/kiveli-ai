<!doctype html>
<html lang="en">
  <body style="margin:0;background:#09070f;color:#f8f4ed;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <p style="margin:0 0 24px;color:#e54aa3;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Kivelli</p>
      <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-size:30px;font-weight:500">Your sign-in code</h1>
      <p style="margin:0 0 24px;color:#c8c1cf;font-size:15px;line-height:1.6">Enter this six-digit code in Kivelli to continue:</p>
      <p style="margin:0 0 24px;padding:18px;border:1px solid #4a284f;border-radius:14px;background:#17101f;color:#ffffff;font-size:30px;font-weight:700;letter-spacing:10px;text-align:center">{{ .Token }}</p>
      <p style="margin:0;color:#8f8798;font-size:13px;line-height:1.6">If you did not request this code, you can ignore this email.</p>
    </div>
  </body>
</html>
